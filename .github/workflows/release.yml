name: release

# Push a tag vX.Y.Z (matching pyproject.toml) to build and publish to PyPI. Needs a PyPI trusted publisher for this
# repository: workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches the package version
        run: test "v$(uv run python -c 'import rosettex; print(rosettex.__version__)')" = "$GITHUB_REF_NAME"
      - run: uv run python -m rosettex.skill --check
      - run: uv build
      # The wheel must contain every subpackage and start: import all modules and run the CLI from the built wheel.
      - name: Wheel smoke
        run: |
          uv venv /tmp/whl && uv pip install --python /tmp/whl dist/*.whl
          /tmp/whl/bin/python -c "import pkgutil, importlib, rosettex; [importlib.import_module(m.name) for m in pkgutil.walk_packages(rosettex.__path__, 'rosettex.') if not m.name.endswith('__main__')]; print('wheel ok')"
          /tmp/whl/bin/rosettex guide > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Wait until PyPI serves this version (the registry checks the package)
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/rosettex/$v/json" >/dev/null && exit 0
            sleep 20
          done
          exit 1
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
