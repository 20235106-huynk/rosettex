[project]
name = "rosettex"
version = "1.0.3"
description = "Translate scientific papers (TeX source or born-digital PDF) into another language with the original layout, for AI agent harnesses"
readme = "README.md"
authors = [{ name = "Nguyễn Kim Huy" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
keywords = ["translation", "latex", "pdf", "scientific-papers", "mcp", "agents"]
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pylatexenc==2.10", "pypdfium2>=5.15,<6", "pypdf>=7.2,<8"]

[project.urls]
Homepage = "https://github.com/20235106-huynk/rosettex"
Source = "https://github.com/20235106-huynk/rosettex"
Issues = "https://github.com/20235106-huynk/rosettex/issues"
Changelog = "https://github.com/20235106-huynk/rosettex/blob/main/CHANGELOG.md"

[project.scripts]
rosettex = "rosettex.cli:main"
rosettex-mcp = "rosettex.mcp:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rosettex"]

[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["F", "E9"]
