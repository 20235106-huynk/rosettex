[project]
name = "rosettex"
version = "0.1.0"
description = "Extracts, checks and rebuilds scientific PDF papers so an agent in a harness can translate them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
requires-python = ">=3.11"
dependencies = ["pypdfium2>=4.30"]

[project.scripts]
rosettex = "rosettex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
