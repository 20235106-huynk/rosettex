<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8102e"/><stop offset="1" stop-color="#7d0a22"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef3b55"/><stop offset="1" stop-color="#b3112d"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b80"/><stop offset="1" stop-color="#d3193a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6cc777"/><stop offset="1" stop-color="#1f7a3e"/>
    </linearGradient>
  </defs>
  <!-- stem and leaves -->
  <path d="M128 150 C 124 178, 134 204, 128 232" fill="none" stroke="#1f7a3e" stroke-width="8" stroke-linecap="round"/>
  <path d="M127 196 C 106 178, 80 180, 64 196 C 86 212, 110 210, 127 196 Z" fill="url(#leaf)"/>
  <path d="M106 199 L 82 196" stroke="#1f7a3e" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M131 178 C 150 160, 178 162, 192 176 C 172 192, 148 192, 131 178 Z" fill="url(#leaf)"/>
  <!-- back petals: scalloped crown -->
  <path d="M60 104 C 50 70, 72 44, 96 52 C 104 30, 152 30, 160 52 C 184 44, 206 70, 196 104 C 190 132, 160 156, 128 158 C 96 156, 66 132, 60 104 Z" fill="url(#back)"/>
  <!-- middle petals -->
  <path d="M74 100 C 72 74, 94 60, 112 68 C 120 56, 140 56, 146 68 C 166 60, 186 76, 182 100 C 178 124, 156 142, 128 144 C 100 142, 78 124, 74 100 Z" fill="url(#mid)"/>
  <!-- bud with spiral -->
  <path d="M100 92 C 98 70, 118 60, 132 64 C 150 68, 160 84, 154 100 C 148 114, 128 116, 120 106 C 112 96, 120 84, 132 86 C 140 88, 142 98, 134 100"
        fill="none" stroke="#7d0a22" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- front cup petals -->
  <path d="M66 104 C 82 118, 104 122, 128 118 C 152 122, 174 118, 190 104 C 188 136, 160 164, 128 166 C 96 164, 68 136, 66 104 Z" fill="url(#front)"/>
  <path d="M128 118 C 124 136, 126 150, 128 166" fill="none" stroke="#b3112d" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M84 116 C 92 132, 104 144, 116 150" fill="none" stroke="#ffd0d8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>
